# Optional (everything also runs without Docker). Verified end-to-end by scripts/demo_docker.ps1
# (HTTP API, SIGKILL of the worker, duplicate event, containers recreated while WAITING_EVENT).
# The reported experiments were NOT run under compose (see REPORT.md "Ограничения").
services:
  publisher:
    build: .
    command: python -m agentrt.cli publisher --db /data/publisher.db --host 0.0.0.0 --port 8765
    volumes: [data:/data]
    ports: ["8765:8765"]
  api:
    build: .
    command: python -m agentrt.cli serve --db /data/state.db --host 0.0.0.0 --port 8000
    volumes: [data:/data]
    ports: ["8000:8000"]
  worker:
    build: .
    command: python -m agentrt.cli worker --db /data/state.db --name w1 --publisher-url http://publisher:8765 --llm ${LLM:-sim}
    env_file: [{path: .env, required: false}]
    volumes: [data:/data]
    depends_on: [publisher, api]
volumes:
  data: {}
